<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Aurora Studios — Gancho 3D</title>
<style>
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:"Inter";src:url(assets/fonts/Inter-Bold.otf);font-weight:700 800}
@font-face{font-family:"Archivo";src:url(../assets/fonts/archivo-latin-wdth-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
canvas{display:block}
.ov{position:absolute;pointer-events:none;opacity:0}
#cap{position:absolute;left:30px;right:30px;top:1470px;text-align:center}
#cap span{display:inline-block;background:#fff;color:#121212;font:600 52px/1.17 Inter,sans-serif;padding:14px 28px 17px;border-radius:16px;max-width:1010px;letter-spacing:-.005em}
#cap span:empty{display:none}
#ovX{left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px}
#ovX::before,#ovX::after{content:"";position:absolute;left:150px;top:-10px;width:40px;height:360px;border-radius:20px;background:#ff2d3f;box-shadow:0 0 30px rgba(255,45,63,.7)}
#ovX::before{transform:rotate(45deg)}#ovX::after{transform:rotate(-45deg)}
.lbl{position:absolute;font:800 44px/1 Archivo,sans-serif;font-stretch:88%;color:#fff;background:rgba(10,12,20,.72);border:3px solid #ffd43b;padding:12px 20px 14px;border-radius:16px;white-space:nowrap;transform:translate(-50%,-140%)}
.lbl small{display:block;font:600 24px/1 Inter;color:rgba(255,255,255,.75);margin-top:6px}
#ovKm{left:0;right:0;top:300px;text-align:center;color:#fff}
#ovKm b{display:block;font:800 190px/0.9 Archivo;font-stretch:80%;color:#ffd43b;text-shadow:0 8px 40px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#ovKm span{font:700 46px/1 Inter;letter-spacing:.08em;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#ovSpeed{left:0;right:0;top:330px;text-align:center;color:#fff}
#ovSpeed b{display:block;font:800 170px/0.9 Archivo;font-stretch:78%;font-variant-numeric:tabular-nums;text-shadow:0 0 50px rgba(120,220,255,.9)}
#ovSpeed span{font:700 44px/1 Inter;letter-spacing:.1em;color:#9fe8ff}
#ovChip{left:50%;top:250px;transform:translateX(-50%);font:700 34px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:#bff3ff;border:3px solid rgba(159,232,255,.7);border-radius:99px;padding:16px 30px;background:rgba(0,30,50,.45)}
#ovTrip{left:90px;right:90px;top:300px;color:#fff}
#ovTrip .row{display:flex;justify-content:space-between;font:700 32px/1 Inter;color:#cfefff}
#ovTrip .bar{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.18);margin:22px 0 0}
#ovTrip .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,#9fe8ff,#ffd43b);width:0}
#ovTrip .bar s{position:absolute;top:-13px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:0 0 30px #9fe8ff;left:0}
#ovTrip .t{margin-top:46px;text-align:center;font:800 170px/0.9 Archivo;font-stretch:78%;font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(120,220,255,.8)}
#ovTrip .t small{font:700 54px/1 Inter;margin-left:10px}
#ovOk{left:50%;top:880px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:#fff;color:#121212;font:800 54px/1 Inter;padding:24px 40px;border-radius:99px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#ovOk em{font-style:normal;color:#1fa1ff;letter-spacing:-.12em}
#ovSize{left:0;right:0;top:250px;text-align:center;color:#fff}
#ovSize b{display:inline-block;font:800 120px/1 Archivo;font-stretch:80%;color:#ffd43b}
#ovSize span{display:block;font:700 40px/1.2 Inter;margin-top:10px;color:#e6f3ff}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
</style>
<script type="importmap">{"imports":{"three":"./assets/three.module.min.js"}}</script>
</head>
<body>
<div id="stage">
  <div id="vig"></div>
  <div class="ov" id="ovX"></div>
  <div class="ov lbl" id="lblV">Valparaíso<small>Chile</small></div>
  <div class="ov lbl" id="lblL">Los Ángeles<small>Estados Unidos</small></div>
  <div class="ov" id="ovKm"><b id="kmN">0</b><span>KILÓMETROS BAJO EL MAR</span></div>
  <div class="ov" id="ovSize"><b>≈ 2 cm</b><span>de grosor, como una manguera</span></div>
  <div class="ov" id="ovChip">Fibra óptica</div>
  <div class="ov" id="ovSpeed"><b id="spN">0</b><span>KM POR SEGUNDO</span></div>
  <div class="ov" id="ovTrip"><div class="row"><span>Valparaíso</span><span>Los Ángeles</span></div><div class="bar"><i id="tripBar"></i><s id="tripDot"></s></div><div class="t"><span id="tripT">0,000</span><small>s</small></div></div>
  <div class="ov" id="ovOk"><em>✓✓</em> Entregado</div>
  <div id="cap"><span id="capT"></span></div>
  <div id="flash"></div>
</div>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "./assets/addons/RoundedBoxGeometry.js";

const W = 1080, H = 1920;
const $ = (s) => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eo = (k) => 1 - Math.pow(1 - k, 3);
const ei = (k) => k * k * k;
const back = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- tiempos (vienen de out/tiempos.json; el renderizador los inyecta) ----------
const TIEMPOS = window.TIEMPOS || (await (await fetch("out/tiempos.json")).json());
const L = Object.fromEntries(TIEMPOS.lineas.map((l) => [l.id, l]));
const T = {
  A: 0, B: L.h3.ini - 0.1, C: L.h5.ini - 0.15, C2: L.h7.ini - 0.05, D: L.h8.ini - 0.15,
  E: L.h11.ini - 0.1, F: L.h15.ini - 0.15, END: L.p1.ini - 0.2,
};
window.HOOK_END = T.END;

// ---------- renderizador + posproceso ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
$("#stage").prepend(renderer.domElement);
const rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });
const post = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt.texture }, uGlitch: { value: 0 }, uTime: { value: 0 }, uShift: { value: 0 }, uGrain: { value: 0.05 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uGlitch,uTime,uShift,uGrain; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv=vUv;
      float band=floor(uv.y*38.+floor(uTime*24.)*7.);
      float r=h(vec2(band,floor(uTime*24.)));
      if(r<uGlitch*.55) uv.x+= (h(vec2(band,3.))-.5)*.18*uGlitch;
      float s=(.004+uShift)*(1.+uGlitch*6.);
      vec3 c=vec3(texture2D(tDiffuse,uv+vec2(s,0.)).r, texture2D(tDiffuse,uv).g, texture2D(tDiffuse,uv-vec2(s,0.)).b);
      c*= 1.-uGlitch*.25*step(.5,fract(uv.y*320.));
      c+= (h(uv*vec2(1080.,1920.)+uTime)-.5)*uGrain;
      gl_FragColor=vec4(c,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));

// ---------- utilidades de escena ----------
function skyDome(top, mid, bot, r = 900) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(top) }, mid: { value: new THREE.Color(mid) }, bot: { value: new THREE.Color(bot) } },
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 top,mid,bot; varying vec3 vP; void main(){ float y=vP.y; vec3 c = y>0. ? mix(mid,top,pow(smoothstep(0.,.75,y),.8)) : mix(mid,bot,smoothstep(0.,-.25,y)); gl_FragColor=vec4(c,1.); }`,
  }));
}
function glowTex(inner = "rgba(255,255,255,1)", mid = "rgba(255,220,120,.45)") {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"); const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner); g.addColorStop(0.18, inner); g.addColorStop(0.4, mid); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex();
const GLOW_CYAN = glowTex("rgba(255,255,255,1)", "rgba(120,220,255,.5)");
function glowSprite(tex = GLOW, scale = 1, color = 0xffffff, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity }));
  s.scale.setScalar(scale); return s;
}
function makeOrb(scale = 1) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.16 * scale, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 3.6, 2.4) })));
  const halo = glowSprite(GLOW, 2.2 * scale, 0xffe7a0); g.add(halo);
  const halo2 = glowSprite(GLOW, 5 * scale, 0xffb84d, 0.35); g.add(halo2);
  g.userData.halo = halo;
  return g;
}
const project = (v, cam) => { cam.updateMatrixWorld(); const p = v.clone().project(cam); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H, z: p.z }; };
const placeOv = (el, p, show = 1) => { el.style.left = p.x + "px"; el.style.top = p.y + "px"; el.style.opacity = show; };

const pmrem = new THREE.PMREMGenerator(renderer);
function envFrom(top, mid, bot) { const s = new THREE.Scene(); s.add(skyDome(top, mid, bot, 50)); return pmrem.fromScene(s, 0.02).texture; }

// =====================================================================
// ESCENA A — Valparaíso: el celular envía el mensaje
// =====================================================================
const A = (() => {
  const s = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(48, W / H, 0.1, 2000);
  s.add(skyDome("#3a78d0", "#ffd2a6", "#f2c49b"));
  s.environment = envFrom("#5a8fd8", "#ffd9b5", "#c9a789");
  s.fog = new THREE.Fog("#f3cfae", 220, 1700);
  s.add(new THREE.HemisphereLight("#cfe6ff", "#7a6247", 1.3));
  const sun = new THREE.DirectionalLight("#ffe0b2", 3.2);
  sun.position.set(-160, 120, -40); sun.target.position.set(0, 20, -50);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 10, far: 500 });
  s.add(sun, sun.target);
  const sunDisc = glowSprite(GLOW, 160, 0xffcf8a, 0.9); sunDisc.position.set(-220, 45, -700); s.add(sunDisc);

  const shoreZ = -105;
  const Hf = (x, z) => {
    const base = (z - shoreZ) * 0.4;
    const r = 7 * Math.sin(x * 0.05 + 0.4) + 3.5 * Math.sin(x * 0.13 + z * 0.06) - 9 * Math.exp(-((x - 35) ** 2) / 150) - 8 * Math.exp(-((x + 55) ** 2) / 180);
    return base > 0 ? base + r * clamp(base / 18) : base * 0.4 - 1;
  };
  const tg = new THREE.PlaneGeometry(360, 230, 180, 115); tg.rotateX(-Math.PI / 2); tg.translate(0, 0, -55);
  const tp = tg.attributes.position, tcol = [];
  const R = rng(3);
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i); tp.setY(i, Hf(x, z));
    const g = 0.5 + 0.5 * Math.sin(x * 0.2 + z * 0.17) * Math.cos(z * 0.11), c = new THREE.Color().setHSL(0.18 + g * 0.06, 0.32, 0.36 + R() * 0.06);
    tcol.push(c.r, c.g, c.b);
  }
  tg.setAttribute("color", new THREE.Float32BufferAttribute(tcol, 3)); tg.computeVertexNormals();
  const terr = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })); terr.receiveShadow = true; s.add(terr);

  const sea = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: "#2f74a6", roughness: 0.18, metalness: 0.35 }));
  sea.rotation.x = -Math.PI / 2; sea.position.y = -0.6; s.add(sea);

  // casas de colores con ventanas
  const wc = document.createElement("canvas"); wc.width = wc.height = 64; const wx = wc.getContext("2d");
  wx.fillStyle = "#fff"; wx.fillRect(0, 0, 64, 64); wx.fillStyle = "#3b3f4a";
  [[10, 12], [38, 12], [10, 38], [38, 38]].forEach(([a, b]) => wx.fillRect(a, b, 16, 16));
  const wtex = new THREE.CanvasTexture(wc); wtex.colorSpace = THREE.SRGBColorSpace;
  const PAL = ["#f2c14e", "#e4572e", "#4f9dde", "#76b041", "#f28ab2", "#fdfcf9", "#9b5de5", "#ff9f45", "#2ec4b6", "#e9e3d5", "#ffd43b", "#d1495b"];
  const N = 1100;
  const hg = new THREE.BoxGeometry(1, 1, 1); hg.translate(0, 0.5, 0);
  const houses = new THREE.InstancedMesh(hg, new THREE.MeshStandardMaterial({ map: wtex, roughness: 0.85 }), N);
  const roofs = new THREE.InstancedMesh(hg, new THREE.MeshStandardMaterial({ roughness: 0.9 }), N);
  houses.castShadow = roofs.castShadow = true; houses.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
  let k = 0;
  for (let i = 0; k < N && i < N * 4; i++) {
    const x = (R() - 0.5) * 250, z = -102 + R() * 128;
    if (z > 8 && Math.abs(x) < 26) continue;
    const y = Hf(x, z) - 0.4; if (y < 0.5) continue;
    const w = 2.6 + R() * 2.4, d = 2.6 + R() * 2.2, h = 2.6 + R() * (z < -80 ? 9 : 4.5);
    q.setFromAxisAngle(V3(0, 1, 0), (R() - 0.5) * 0.3);
    m.compose(ps.set(x, y, z), q, sc.set(w, h, d)); houses.setMatrixAt(k, m);
    houses.setColorAt(k, new THREE.Color(PAL[Math.floor(R() * PAL.length)]));
    m.compose(ps.set(x, y + h, z), q, sc.set(w + 0.5, 0.45, d + 0.5)); roofs.setMatrixAt(k, m);
    roofs.setColorAt(k, new THREE.Color(["#8c3b2c", "#5b5e66", "#a4552f", "#e9e3d5"][Math.floor(R() * 4)]));
    k++;
  }
  houses.count = roofs.count = k; s.add(houses, roofs);
  // barcos en la bahía
  for (let i = 0; i < 0; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(6 + R() * 6, 2, 2.4), new THREE.MeshStandardMaterial({ color: i % 3 ? "#f4f1ea" : "#c0392b", roughness: 0.6 }));
    b.position.set((R() - 0.5) * 220, 0.5, -150 - R() * 120); b.rotation.y = R() * 3; s.add(b);
  }

  // celular
  const sc2 = document.createElement("canvas"); sc2.width = 600; sc2.height = 1280;
  const sx = sc2.getContext("2d");
  const stex = new THREE.CanvasTexture(sc2); stex.colorSpace = THREE.SRGBColorSpace; stex.anisotropy = 8;
  const phone = new THREE.Group();
  phone.add(new THREE.Mesh(new RoundedBoxGeometry(1.0, 2.08, 0.1, 6, 0.13), new THREE.MeshStandardMaterial({ color: "#16161c", metalness: 0.7, roughness: 0.28 })));
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.93, 1.99), new THREE.MeshBasicMaterial({ map: stex, toneMapped: true }));
  screen.position.z = 0.0515; phone.add(screen);
  s.add(phone);
  const MSG = "¡Hola desde Valpo! ¿Cómo estás?";
  let lastScreen = "";
  function drawScreen(typed, sent, glow) {
    const key = typed + "|" + sent + "|" + glow.toFixed(2);
    if (key === lastScreen) return; lastScreen = key;
    const x = sx, w = 600, h = 1280;
    x.fillStyle = "#efe9df"; x.fillRect(0, 0, w, h);
    // patrón de fondo
    x.fillStyle = "rgba(0,0,0,.035)"; for (let i = 0; i < 80; i++) { x.beginPath(); x.arc((i * 97) % w, (i * 151) % h, 10, 0, 7); x.fill(); }
    // isla + barra
    x.fillStyle = "#15141b"; x.fillRect(0, 0, w, 210);
    x.fillStyle = "#000"; x.beginPath(); x.roundRect(230, 22, 140, 40, 20); x.fill();
    x.fillStyle = "#fff"; x.font = "600 30px Inter"; x.fillText("12:00", 44, 54);
    x.fillStyle = "#4f9dde"; x.beginPath(); x.arc(84, 140, 42, 0, 7); x.fill();
    x.fillStyle = "#fff"; x.font = "700 38px Inter"; x.fillText("J", 72, 154);
    x.font = "700 40px Inter"; x.fillText("Juan", 146, 134);
    x.font = "600 26px Inter"; x.fillStyle = "#aeb3c2"; x.fillText("Los Ángeles, EE.UU.", 146, 172);
    // mensaje recibido
    x.fillStyle = "#fff"; x.beginPath(); x.roundRect(30, 250, 360, 92, 26); x.fill();
    x.fillStyle = "#222"; x.font = "600 32px Inter"; x.fillText("¡Feliz cumple! 🎉".replace("🎉", ""), 56, 306);
    // mensaje enviado
    if (sent) {
      const bx = 120, by = 370, bw = 450, bh = 150;
      if (glow > 0) { x.shadowColor = `rgba(255,190,40,${glow})`; x.shadowBlur = 60 * glow; }
      x.fillStyle = "#ffd43b"; x.beginPath(); x.roundRect(bx, by, bw, bh, 28); x.fill(); x.shadowBlur = 0;
      x.fillStyle = "#15141b"; x.font = "600 34px Inter"; x.fillText("¡Hola desde Valpo!", bx + 28, by + 58); x.fillText("¿Cómo estás?", bx + 28, by + 104);
      x.font = "600 22px Inter"; x.fillStyle = "rgba(21,20,27,.6)"; x.fillText("12:00 ✓", bx + bw - 120, by + bh - 18);
    }
    // barra de escritura
    x.fillStyle = "#fff"; x.beginPath(); x.roundRect(24, h - 140, w - 140, 96, 48); x.fill();
    x.fillStyle = typed ? "#222" : "#9a9a9a"; x.font = "600 30px Inter";
    const shown = typed ? (typed.length > 22 ? "…" + typed.slice(-21) : typed) : "Mensaje";
    x.fillText(shown, 56, h - 80);
    x.fillStyle = "#ffd43b"; x.beginPath(); x.arc(w - 66, h - 92, 46, 0, 7); x.fill();
    x.fillStyle = "#15141b"; x.beginPath(); x.moveTo(w - 84, h - 112); x.lineTo(w - 42, h - 92); x.lineTo(w - 84, h - 72); x.lineTo(w - 76, h - 92); x.closePath(); x.fill();
    stex.needsUpdate = true;
  }

  const orb = makeOrb(1.2); s.add(orb);
  const orbLight = new THREE.PointLight("#ffd27a", 0, 30, 1.5); orb.add(orbLight);
  const trail = Array.from({ length: 14 }, () => { const sp = glowSprite(GLOW, 1, 0xffd27a, 0.5); s.add(sp); return sp; });

  const P0 = V3(0, Hf(0, 32) + 7.5, 32), L0 = V3(0, 24, -95);
  const dir = L0.clone().sub(P0).normalize();
  const camUp = V3(0, 1, 0).sub(dir.clone().multiplyScalar(dir.y)).normalize();
  const phonePos = P0.clone().add(dir.clone().multiplyScalar(3.7)).add(camUp.clone().multiplyScalar(-0.12));
  phone.position.copy(phonePos); phone.lookAt(P0);
  const bubbleLocal = V3(0.06, 0.38, 0.06);

  function update(t) {
    const typed = MSG.slice(0, Math.floor(seg(t, 0.12, 1.15) * MSG.length));
    const sent = t >= 1.25;
    const glow = seg(t, 1.9, 2.3);
    drawScreen(sent ? "" : typed, sent, glow);
    phone.rotation.z = Math.sin(t * 1.3) * 0.015;
    // vuelo del orbe
    const launch = 2.25;
    const bubbleW = phone.localToWorld(bubbleLocal.clone());
    const k = seg(t, launch, 3.9);
    const p1 = bubbleW.clone().add(V3(0, 1.2, 1.2)), p2 = V3(-6, 40, -60), p3 = V3(-14, 0, -230);
    const ke = eio(k);

const E = (() => {
  const s = new THREE.Scene();

  s.background = new THREE.Color("#010812");
  s.fog = new THREE.Fog("#010812", 30, 260);
  const tc = document.createElement("canvas"); tc.width = 512; tc.height = 512; const tx = tc.getContext("2d");
  tx.fillStyle = "#04203a"; tx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 26; i++) { const x = (i * 19.7) % 512; tx.fillStyle = `rgba(120,220,255,${0.15 + (i % 5) * 0.08})`; tx.fillRect(x, 0, 2 + (i % 3), 512); }
  tx.fillStyle = "rgba(160,235,255,.35)"; for (let j = 0; j < 8; j++) tx.fillRect(0, j * 64, 512, 2);
  const ttex = new THREE.CanvasTexture(tc); ttex.wrapS = ttex.wrapT = THREE.RepeatWrapping; ttex.repeat.set(4, 30); ttex.colorSpace = THREE.SRGBColorSpace;

    const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.06 + R() * 0.08, 6 + R() * 14, 4, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.52 + R() * 0.1, 1, 0.75).multiplyScalar(2.5), transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
    c.rotation.x = Math.PI / 2; const a = R() * Math.PI * 2, r = 1.5 + R() * 4; c.position.set(Math.cos(a) * r, Math.sin(a) * r, 0); s.add(c);
    streaks.push({ c, z0: -R() * 300, sp: 0.6 + R() * 0.8 });

  function update(t, dur) {

    const dist = 60 * t + 0.5 * (260 - 60) / 3 * Math.min(t, 3) ** 2 * 0 + (t > 3 ? (t - 3) * 200 : 0) + Math.min(t, 3) * Math.min(t, 3) * 33;

    pulses.forEach((o, i) => { const z = ((o.z0 + dist * 2.2) % 300) - 280; o.p.position.set(Math.sin(i * 2) * 1.2, Math.cos(i * 3) * 1.2, z); });
    cam.position.set(Math.sin(t * 1.7) * 0.4, Math.cos(t * 1.3) * 0.3, 0);

// ESCENA F — El tiburón muerde el cable
// =====================================================================
function makeShark() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0.05 });
  mat.userData.u = { uTime: { value: 0 }, uAmp: { value: 0.22 } };
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, mat.userData.u);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nuniform float uTime,uAmp;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nfloat wgt = smoothstep(0.5,-1.9,transformed.x);\ntransformed.z += sin(uTime*7.0 - transformed.x*1.7)*uAmp*wgt;");
  };
  const back = new THREE.Color("#7591a4"), belly = new THREE.Color("#eef3f5");
  const paint = (geo, fn) => { const p = geo.attributes.position, c = []; for (let i = 0; i < p.count; i++) { const col = fn(p.getX(i), p.getY(i), p.getZ(i)); c.push(col.r, col.g, col.b); } geo.setAttribute("color", new THREE.Float32BufferAttribute(c, 3)); };
  // cuerpo
  const body = new THREE.SphereGeometry(1, 64, 32); const bp = body.attributes.position;
  for (let i = 0; i < bp.count; i++) {
    const x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i);
    const k = x < 0 ? 1 - Math.pow(-x, 1.7) * 0.86 : 1 - Math.pow(x, 2.6) * 0.5;
    let Y = y * 0.62 * k; if (Y < 0) Y *= 0.82;
    bp.setXYZ(i, x * 1.75 + (x > 0.6 ? -Y * 0.25 : 0), Y, z * 0.56 * k);
  }
  body.computeVertexNormals();
  paint(body, (x, y) => back.clone().lerp(belly, 1 - THREE.MathUtils.smoothstep(y, -0.2, 0.08)));
  g.add(new THREE.Mesh(body, mat));
  const fin = (pts, depth, mtx) => { const sh = new THREE.Shape(pts.map(([a, b]) => new THREE.Vector2(a, b))); const geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 }); geo.translate(0, 0, -depth / 2); geo.applyMatrix4(mtx); paint(geo, () => back); geo.computeVertexNormals(); g.add(new THREE.Mesh(geo, mat)); };
  const M = (x, y, z, rx = 0, ry = 0, rz = 0) => new THREE.Matrix4().compose(V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V3(1, 1, 1));
  fin([[0.35, 0], [-0.32, 0], [-0.28, 0.08], [-0.25, 0.78]], 0.07, M(0.05, 0.42, 0));            // dorsal
  fin([[0, 0], [-0.62, 0.95], [-0.4, 0.05], [-0.5, -0.58]], 0.06, M(-1.62, 0.02, 0));            // cola
  fin([[0.28, 0], [-0.25, 0], [-0.55, -0.75]], 0.05, M(0.55, -0.22, 0.32, -0.9, 0.2, 0));         // aleta izq
  fin([[0.28, 0], [-0.25, 0], [-0.55, -0.75]], 0.05, M(0.55, -0.22, -0.32, 0.9, -0.2, 0));        // aleta der
  fin([[0.1, 0], [-0.18, 0], [-0.12, 0.2]], 0.04, M(-1.12, 0.17, 0));                             // segunda dorsal
  const eyeM = new THREE.MeshStandardMaterial({ color: "#050505", roughness: 0.1, metalness: 0.3 });
  [-1, 1].forEach((sg) => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 10), eyeM); e.position.set(1.28, 0.1, sg * 0.24); g.add(e); });
  // mandíbula
  const jaw = new THREE.Group(); jaw.position.set(0.95, -0.2, 0);
  const jg = new THREE.ConeGeometry(0.3, 0.75, 24, 1, false, Math.PI, Math.PI); jg.rotateZ(-Math.PI / 2); jg.scale(1, 0.45, 1.2); jg.translate(0.37, 0, 0);
  const jm = new THREE.Mesh(jg, new THREE.MeshStandardMaterial({ color: "#dde3e6", roughness: 0.5 })); jaw.add(jm);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.04, 0.42), new THREE.MeshStandardMaterial({ color: "#5a0f16", roughness: 0.8 })); mouth.position.set(0.33, 0.02, 0); jaw.add(mouth);
  for (let i = 0; i < 9; i++) { const tth = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.09, 6), new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.3 })); const a = (i / 8 - 0.5) * 2.2; tth.position.set(0.62 - Math.abs(a) * 0.18, 0.06, a * 0.17); jaw.add(tth); }
  g.add(jaw);
  g.userData = { mat, jaw };
  return g;
}
const F = (() => {
  const s = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);
  s.background = new THREE.Color("#021320");
  s.fog = new THREE.FogExp2("#021320", 0.028);
  s.add(new THREE.HemisphereLight("#5fb3e0", "#0a1a26", 0.9));
  const moon = new THREE.DirectionalLight("#cfeaff", 2.4); moon.position.set(10, 40, 20); s.add(moon);
  const rimL = new THREE.DirectionalLight("#5fb8ff", 2.0); rimL.position.set(-20, 10, -30); s.add(rimL);
  const pulseLight = new THREE.PointLight("#ffd27a", 0, 30, 1.5); s.add(pulseLight);
  const bed = makeSeabed(4); bed.position.y = -100; s.add(bed);
  const cable = makeCable(0.35); cable.position.y = -100; s.add(cable);
  const cLight = new THREE.PointLight("#ffd27a", 0, 40, 1.4); s.add(cLight);
  const shark = makeShark(); shark.scale.setScalar(2.0); s.add(shark);
  const R = rng(55), sparks = [];
  for (let i = 0; i < 60; i++) { const sp = glowSprite(GLOW, 0.3 + R() * 0.5, R() < 0.5 ? 0xfff2b0 : 0x9fe8ff); s.add(sp); sparks.push({ sp, v: V3((R() - 0.5) * 9, R() * 8, (R() - 0.5) * 9), d: 0.3 + R() * 0.6 }); }
  const NP = 900, pg = new THREE.BufferGeometry(), pa = new Float32Array(NP * 3), seeds = [];
  for (let i = 0; i < NP; i++) seeds.push([R() * 60 - 30, -100 + R() * 25, R() * 80 - 60, R()]);
  pg.setAttribute("position", new THREE.BufferAttribute(pa, 3));
  s.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: "#a9dcf2", size: 0.18, transparent: true, opacity: 0.6, depthWrite: false })));
  const bite = V3(0.9, -99.0, -6.0);
  function update(t, dur) {
    const tb = L.h16.ini - T.F + 0.75; // mordida
    shark.userData.mat.userData.u.uTime.value = t;
    shark.userData.mat.userData.u.uAmp.value = t < tb ? 0.22 : 0.32;
    // trayectoria: llega desde la oscuridad y baja hacia el cable
    const k = eo(seg(t, 0, tb));
    const start = V3(bite.x - 27, bite.y + 7, bite.z + 3);
    const dirv = bite.clone().sub(start).setY(0).normalize();
    const end = bite.clone().sub(dirv.clone().multiplyScalar(2.9)).add(V3(0, 1.05, 0));
    const p = start.clone().lerp(end, k);
    p.y += Math.sin(k * Math.PI) * 1.5;
    const shake = t > tb ? Math.sin(t * 38) * 0.3 * (1 - seg(t, tb, tb + 1.2)) : 0;
    shark.position.copy(p).add(V3(0, 0, shake));
    shark.rotation.set(0, Math.atan2(-dirv.z, dirv.x), 0);
    shark.rotateZ(lerp(-0.08, -0.32, seg(t, tb - 0.7, tb)) + shake * 0.25);
    shark.userData.jaw.rotation.z = -0.55 * seg(t, tb - 0.55, tb - 0.15) + 0.5 * seg(t, tb, tb + 0.08);
    // cable: pulsos hasta la mordida, luego chispazos y se apaga
    const u = cable.material.userData.u;
    u.uPulse.value = ((t * 0.35) % 1.2) - 0.1; u.uPulse2.value = ((t * 0.35 + 0.6) % 1.2) - 0.1;
    const dead = seg(t, tb + 0.35, tb + 0.9);
    const flick = t > tb && t < tb + 0.9 ? (Math.sin(t * 90) > 0 ? 1 : 0.15) : 1;
    u.uOn.value = (1 - dead) * flick;
    // chispas
    sparks.forEach((o) => { const lt = t - tb; const on = lt > 0 && lt < o.d; o.sp.visible = on; if (on) { o.sp.position.copy(bite).add(o.v.clone().multiplyScalar(lt)).add(V3(0, -4 * lt * lt, 0)); o.sp.material.opacity = 1 - lt / o.d; } });
    const pp = cableCurve.getPointAt(clamp(u.uPulse.value, 0, 1)).add(V3(0, -100, 0)); pulseLight.position.copy(pp).add(V3(0, 1.5, 0)); pulseLight.intensity = 120 * u.uOn.value;
    cLight.position.copy(bite).add(V3(0, 1.5, 0)); cLight.intensity = t > tb ? 260 * (1 - seg(t, tb, tb + 0.6)) * flick : 0;
    for (let i = 0; i < NP; i++) { const [x, y, z, r] = seeds[i]; pa[i * 3] = x + Math.sin(t * 0.4 + r * 9) * 0.5; pa[i * 3 + 1] = y - ((t * (0.4 + r * 0.5)) % 4); pa[i * 3 + 2] = z; }
    pg.attributes.position.needsUpdate = true;
    // cámara baja junto al cable, con sacudón
    const ck = eio(seg(t, 0, tb));
    cam.position.set(bite.x + lerp(-4, 0, ck), bite.y + lerp(3.6, 2.8, ck), bite.z + lerp(18, 13.5, ck));
    const sh = t > tb ? (1 - seg(t, tb, tb + 0.8)) : 0;
    cam.position.add(V3(Math.sin(t * 61) * 0.25 * sh, Math.cos(t * 53) * 0.25 * sh, 0));
    cam.lookAt(V3(bite.x - lerp(7, 2.2, ck), bite.y + lerp(3, 1.2, ck), bite.z));
    // glitch al final
    post.uniforms.uGlitch.value = Math.max(sh * 0.6, seg(t, dur - 0.8, dur - 0.1));
    $("#flash").style.opacity = t > tb ? Math.max(0, 0.7 - (t - tb) * 3) : 0;
    return { s, cam };
  }
  return { s, cam, update };
})();

// ---------- control de tiempo ----------
const SCN = [
  { a: T.A, b: T.B, o: A }, { a: T.B, b: T.C, o: B }, { a: T.C, b: T.D, o: C },
  { a: T.D, b: T.E, o: D }, { a: T.E, b: T.F, o: E }, { a: T.F, b: T.END, o: F },
];
const overlays = ["#ovX", "#lblV", "#lblL", "#ovKm", "#ovSize", "#ovChip", "#ovSpeed", "#ovTrip", "#ovOk"];
function caption(t) {
  const ls = TIEMPOS.lineas; let txt = "";
  for (let i = 0; i < ls.length; i++) { const nx = ls[i + 1] ? ls[i + 1].ini : ls[i].fin + 0.8; if (t >= ls[i].ini && t < nx) txt = ls[i].texto; }
  return txt;
}
window.caption = caption;
window.seek = (t) => {
  overlays.forEach((s) => ($(s).style.opacity = 0));
  $("#flash").style.opacity = 0;
  post.uniforms.uGlitch.value = 0; post.uniforms.uShift.value = 0; post.uniforms.uTime.value = t;
  const sc = SCN.find((x) => t >= x.a && t < x.b) || SCN[SCN.length - 1];
  const r = sc.o.update(t - sc.a, sc.b - sc.a, t) || sc.o;
  // pequeño destello en cada corte
  const cut = SCN.some((x) => x.a > 0 && Math.abs(t - x.a) < 0.05);
  if (cut) post.uniforms.uShift.value += 0.004;
  renderer.setRenderTarget(rt); renderer.render(r.s, r.cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  const c = t < T.END ? caption(t) : "";
  const el = $("#capT"); if (el.textContent !== c) el.textContent = c;
};
